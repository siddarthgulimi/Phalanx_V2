<!-- title=Sign in;js=login;body=auth -->
<div class="center">
  <form class="card auth-card" id="form" style="display:grid;gap:14px">
    <div class="row"><div class="avatar" style="width:44px;height:44px;font-size:1.2em" id="av">?</div><div><h2 id="hi">Welcome back</h2><div class="dim" id="sub">Sign in to Phalanx</div></div></div>
    <input type="password" id="pass" placeholder="Passcode" autocomplete="current-password" />
    <button class="btn primary" type="submit" id="go">Sign in</button>
    <div class="dim" style="font-size:.85em" id="msg"></div>
  </form>
</div>
