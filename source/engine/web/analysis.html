<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Threat analysis · Phalanx</title>
<link rel="icon" href="/img/icon.png" />
<link rel="stylesheet" href="/shared/palette.css" />
<link rel="stylesheet" href="/shared/ui.css" />
<link rel="stylesheet" href="/css/app.css" />
<script src="/shared/edition.js"></script>
<script src="/js/boot.js"></script>
</head>
<body>
<main id="page">
  <div class="grid" style="grid-template-columns:320px 1fr;align-items:start">
    <div class="card" style="position:sticky;top:90px;padding:12px">
      <div class="seg" id="scopeSeg" style="width:100%;margin-bottom:10px">
        <button data-s="analysis" class="on" style="flex:1">Under analysis</button><button data-s="all" style="flex:1">All recent</button>
      </div>
      <div id="list" style="max-height:calc(100vh - 230px);overflow-y:auto"></div>
    </div>
    <div>
      <div class="card" id="analyst" style="margin-bottom:14px;padding:12px 16px">
        <div class="row" style="flex-wrap:wrap;gap:4px 16px;font-size:.92em">
          <span class="label">Phalanx Analyst</span>
          <div class="check run" data-step="0"><span class="ic"></span>Collect evidence</div>
          <div class="check run" data-step="1"><span class="ic"></span>Weigh signals</div>
          <div class="check run" data-step="2"><span class="ic"></span>Classify threat</div>
          <div class="check run" data-step="3"><span class="ic"></span>Recommend actions</div>
        </div>
      </div>
      <div id="report"></div>
    </div>
  </div>
</main>
<script src="/shared/intel.js"></script>
<script src="/shared/analysis.js"></script>
<script src="/shared/report-view.js"></script>
<script src="/js/charts.js"></script>
<script src="/js/app.js"></script>
<script src="/js/analysis.js"></script>
</body>
</html>
